name: Build public VPN apk and publish to release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout site repo (patch, icons, signing key)
      uses: actions/checkout@v7
      with:
        path: overlay

    - name: Checkout v2rayNG
      uses: actions/checkout@v7
      with:
        repository: 2dust/v2rayNG
        path: src
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Apply patch (public variant, no bundled key)
      env:
        BUILD_VARIANT: public
      run: python3 overlay/vpn-app/apply_patch.py src overlay/vpn-app/overlay

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;30.0.16248370"
        echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> $GITHUB_ENV
        sed -i '10i\
        \
            ndkVersion = "30.0.16248370"' ${{ github.workspace }}/src/V2rayNG/app/build.gradle.kts

    - name: Build libhevtun
      run: |
        cd ${{ github.workspace }}/src
        bash compile-hevtun.sh

    - name: Copy libhevtun
      run: |
        cp -r ${{ github.workspace }}/src/libs ${{ github.workspace }}/src/V2rayNG/app

    - name: Fetch AndroidLibXrayLite tag
      run: |
        pushd src/AndroidLibXrayLite
        CURRENT_TAG=$(git describe --tags --abbrev=0)
        echo "Current tag in this repo: $CURRENT_TAG"
        echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
        popd

    - name: Download libv2ray
      uses: robinraju/release-downloader@v1.13
      with:
        repository: '2dust/AndroidLibXrayLite'
        tag: ${{ env.CURRENT_TAG }}
        fileName: 'libv2ray.aar'
        out-file-path: src/V2rayNG/app/libs/

    - name: Setup Java
      uses: actions/setup-java@v6.1.0
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Build APK
      run: |
        cd ${{ github.workspace }}/src/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew assemblePlaystoreRelease \
          -Pandroid.injected.signing.store.file=${{ github.workspace }}/overlay/vpn-app/signing/public.jks \
          -Pandroid.injected.signing.store.password=vpnpublic2026 \
          -Pandroid.injected.signing.key.alias=pub \
          -Pandroid.injected.signing.key.password=vpnpublic2026

    - name: Rename APK
      run: |
        mkdir -p dist
        cp src/V2rayNG/app/build/outputs/apk/*/release/*universal*.apk dist/Andrei-VPN-public.apk

    - name: Publish to release v1 (replace old file)
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release upload v1 dist/Andrei-VPN-public.apk --clobber --repo ${{ github.repository }}
