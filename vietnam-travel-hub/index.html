<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Vietnam Travel Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: left-aligned editorial hero over a fixed underwater video; glass panels float above it. Single dark look by choice (deep water). */
:root{
  --ink:#04141c;          /* deep water */
  --fg:#f1f8fa;           /* foam */
  --fg-dim:#b9d0d8;
  --accent:#6ee7d3;       /* shallow lagoon */
  --sun:#ffb27a;          /* coral sand, for booking CTAs */
  --glass:rgba(255,255,255,.07);
  --glass-strong:rgba(6,24,34,.38);
  --edge:rgba(255,255,255,.18);
  --font-display:"Unbounded","Manrope",system-ui,sans-serif;
  --font-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--ink);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;overflow-x:hidden;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:rgba(4,20,28,.7);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
a{color:inherit}
h1,h2,h3{font-family:var(--font-display);font-weight:500;line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}

/* video background */
.bg{position:fixed;inset:0;z-index:-2;overflow:hidden;background:var(--ink)}
.water{position:absolute;inset:-10%;background:
  radial-gradient(60% 50% at 20% 25%,rgba(72,200,210,.55),transparent 70%),
  radial-gradient(50% 45% at 80% 70%,rgba(20,110,150,.7),transparent 70%),
  linear-gradient(180deg,#0a4d66 0%,#06283a 55%,#031018 100%);
  animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(3%,2%,0) scale(1.06)}}
.bg video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.4s ease}
.bg video.on{opacity:1}
.shade{position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(3,16,24,.62),rgba(3,16,24,.5) 40%,rgba(3,16,24,.72));pointer-events:none}

.glass{background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,.22)}
.wrap{max-width:1160px;margin:0 auto}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin:12px auto 0;max-width:1160px}
.bar{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:16px;flex-wrap:wrap}
.logo{font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.01em;text-decoration:none;display:flex;align-items:baseline;gap:6px;margin-right:auto}
.logo small{font-family:var(--font-body);font-weight:500;font-size:11px;color:var(--accent);letter-spacing:.14em;text-transform:uppercase}
nav{display:flex;gap:18px}
nav a{text-decoration:none;color:var(--fg-dim);font-size:14px;font-weight:500}
nav a:hover{color:var(--fg)}
.lang{display:flex;border:1px solid var(--edge);border-radius:999px;padding:3px;gap:2px}
.lang button{all:unset;cursor:pointer;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--fg-dim)}
.lang button[aria-pressed="true"]{background:var(--accent);color:#04282a}
.lang button:focus-visible{outline:2px solid var(--accent)}
.msg{display:flex;gap:6px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:999px;font-weight:700;font-size:14px;text-decoration:none;border:1px solid var(--edge);background:rgba(255,255,255,.08);color:var(--fg);cursor:pointer;font-family:inherit;transition:background .2s,transform .2s}
.btn:hover{background:rgba(255,255,255,.16);transform:translateY(-1px)}
.btn.wa{background:#1fa855;border-color:#1fa855;color:#fff}
.btn.wa:hover{background:#25bf62}
.btn.tg{background:#2a9bd6;border-color:#2a9bd6;color:#fff}
.btn.tg:hover{background:#3aaee9}
.btn.sun{background:var(--sun);border-color:var(--sun);color:#3a1d08}
.btn.sun:hover{background:#ffc299}
.btn svg{width:16px;height:16px;fill:currentColor;flex:none}
.btn .short{display:none}

/* hero */
.hero{padding-block:clamp(48px,9vw,110px) clamp(32px,5vw,56px);display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:32px;align-items:end}
.eyebrow{color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;margin-bottom:18px}
h1{font-size:clamp(30px,5.4vw,60px);font-weight:700;letter-spacing:-.01em}
.lead{margin-top:20px;font-size:clamp(16px,1.6vw,19px);color:var(--fg-dim);max-width:54ch}
.cta-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.facts{padding:20px 22px;display:grid;gap:14px}
.fact{display:flex;justify-content:space-between;gap:16px;align-items:baseline;border-bottom:1px solid var(--edge);padding-bottom:12px}
.fact:last-child{border:0;padding:0}
.fact span{color:var(--fg-dim);font-size:14px}
.fact b{font-family:var(--font-display);font-weight:500;font-size:15px;text-align:right}

/* promo */
.promo{margin-block:10px 0;padding:clamp(20px,3vw,32px);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;background:linear-gradient(120deg,rgba(255,178,122,.2),rgba(255,255,255,.06));border-color:rgba(255,178,122,.45)}
.promo .tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--sun);margin-bottom:10px}
.promo h2{font-size:clamp(20px,2.6vw,28px)}
.promo p{margin-top:10px;color:var(--fg-dim);max-width:62ch}

section{scroll-margin-top:84px}
section{padding-block:clamp(40px,7vw,80px) 0}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:26px}
h2.title{font-size:clamp(24px,3.4vw,38px);font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{all:unset;cursor:pointer;padding:8px 14px;border-radius:999px;border:1px solid var(--edge);font-size:13px;font-weight:700;color:var(--fg-dim);background:rgba(255,255,255,.04)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--ink);border-color:var(--fg)}
.chip:focus-visible{outline:2px solid var(--accent)}

/* tour cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px}
.tour{padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0;transition:transform .25s,border-color .25s}
.tour:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.34)}
.tour .meta{display:flex;justify-content:space-between;gap:10px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.tour .meta span:last-child{color:var(--fg-dim)}
.tour h3{font-size:20px}
.tour .desc{color:var(--fg-dim);font-size:15px;flex:1}
.tour .inc{font-size:13px;color:var(--fg);border-top:1px dashed var(--edge);padding-top:12px}
.price{font-family:var(--font-display);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.price small{font-family:var(--font-body);font-weight:500;font-size:13px;color:var(--fg-dim)}
.price.ask{font-size:18px;font-weight:500;color:var(--sun)}
.tour .msg{flex-wrap:wrap}
.tour .btn{flex:1;justify-content:center;min-width:120px}

/* gallery */
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:14px}
.shot{all:unset;cursor:zoom-in;position:relative;display:block;border-radius:18px;overflow:hidden;aspect-ratio:4/5;border:1px solid var(--edge);box-shadow:0 10px 40px rgba(0,0,0,.22)}
.shot:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.shot img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}
.shot:hover img{transform:scale(1.05)}
.shot span{position:absolute;inset:auto 0 0 0;padding:34px 16px 14px;background:linear-gradient(180deg,transparent,rgba(3,16,24,.82));font-size:14px;font-weight:700;color:var(--fg)}
.lb{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:rgba(3,14,20,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lb.open{display:flex}
.lb img{max-width:100%;max-height:78vh;border-radius:14px;object-fit:contain}
.lb p{font-weight:700;text-align:center}
.lb .ctl{display:flex;gap:10px}
.lb button{all:unset;cursor:pointer;padding:9px 16px;border-radius:999px;border:1px solid var(--edge);background:rgba(255,255,255,.1);font-weight:700;font-size:14px}
.lb button:hover{background:rgba(255,255,255,.2)}
.lb button:focus-visible{outline:2px solid var(--accent)}

/* price list */
.table-wrap{overflow-x:auto;padding:6px 6px}
table{width:100%;border-collapse:collapse;min-width:520px}
th,td{padding:14px 16px;text-align:left;border-bottom:1px solid var(--edge)}
tr:last-child td{border-bottom:0}
th{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-dim);font-weight:700}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.num{font-family:var(--font-display);font-weight:500}
td.num.ask{font-family:var(--font-body);color:var(--sun);font-weight:700}
.note{margin-top:14px;font-size:13px;color:var(--fg-dim);max-width:78ch}

/* steps + faq */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px;counter-reset:s}
.step{padding:22px;counter-increment:s}
.step::before{content:counter(s);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--accent);color:#04282a;font-family:var(--font-display);font-weight:700;font-size:14px;margin-bottom:14px}
.step h3{font-size:17px;margin-bottom:8px}
.step p{color:var(--fg-dim);font-size:15px}
.faq{display:grid;gap:10px}
details{padding:0}
summary{cursor:pointer;padding:18px 22px;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:16px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--accent);font-size:22px;line-height:1}
details[open] summary::after{content:"\2212"}
details p{padding:0 22px 20px;color:var(--fg-dim)}

footer{padding-block:clamp(40px,7vw,80px) max(32px,env(safe-area-inset-bottom,0px))}
.foot{padding:clamp(22px,4vw,40px);display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:center}
.foot h2{font-size:clamp(20px,2.8vw,30px);max-width:22ch}
.copy{margin-top:20px;font-size:12px;color:var(--fg-dim);text-align:center}

@media (max-width:820px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .promo{grid-template-columns:minmax(0,1fr)}
  nav{display:none}
  .btn .full{display:none}.btn .short{display:inline}
}
@media (max-width:480px){
  .bar{gap:8px;padding:8px 10px}
  .logo small{display:none}
  .btn{padding:8px 12px}
}
.dock{display:none}
@media (max-width:640px){
  .bar .msg{display:none}
  .bar{flex-wrap:nowrap}
  .dock{display:flex;gap:10px;position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px max(16px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:rgba(4,20,28,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--edge)}
  .dock .btn{flex:1;justify-content:center;padding:12px 14px;font-size:15px}
  footer{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
}
</style>

function fmtPrice(usd, lang) {
  var n;
  if (lang === "en") return "$" + usd;
  n = Math.round(usd * CONFIG.rates[lang] / CONFIG.roundTo[lang]) * CONFIG.roundTo[lang];
  var s = String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  return lang === "ru" ? s + "\u00A0₽" : s + "\u00A0so'm";
}
function priceLabel(t, lang) {
  if (t.usd == null) return UI[lang].ask;
  var f = UI[lang].from;
  return (t.from && f ? f + " " : "") + fmtPrice(t.usd, lang);
}
function contact(kind, text, lang) {
  var c = CONFIG.contacts[lang === "uz" ? "uz" : "cis"];
  var q = encodeURIComponent(text);
  return kind === "wa" ? "https://wa.me/" + c.wa + "?text=" + q : "https://t.me/" + c.tg + "?text=" + q;
}
function msgFor(key, lang, tour) {
  var u = UI[lang];
  if (key === "tour") return u.m_tour.replace("{n}", tour.name[lang]).replace("{p}", priceLabel(tour, lang));
  return u["m_" + key];
}
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

  var list = TOURS.filter(function(t){ return state.cat === "all" || t.cat === state.cat; });
  document.getElementById("grid").innerHTML = list.map(function(t){
    var ask = t.usd == null;
    return '<article class="tour glass">' +
      '<div class="meta"><span>' + esc(t.tag[L]) + '</span><span>' + esc(t.dur ? t.dur[L] : "") + "</span></div>" +
      "<h3>" + esc(t.name[L]) + "</h3>" +
      '<p class="desc">' + esc(t.desc[L]) + "</p>" +
      (t.inc ? '<p class="inc">' + esc(t.inc[L]) + "</p>" : "") +
      '<div class="price' + (ask ? " ask" : "") + '">' + esc(priceLabel(t, L)) + "</div>" +
      '<div class="msg">' +
        '<a class="btn wa" target="_blank" rel="noopener" href="' + contact("wa", msgFor("tour", L, t), L) + '">WhatsApp</a>' +
        '<a class="btn tg" target="_blank" rel="noopener" href="' + contact("tg", msgFor("tour", L, t), L) + '">Telegram</a>' +
      "</div></article>";
  }).join("");

  document.querySelector('[data-i18n="f2v"]').textContent = String(TOURS.length);

  // gallery
  document.getElementById("shots").innerHTML = GALLERY.map(function(g, i){
    return '<button type="button" class="shot" data-i="' + i + '"><img loading="lazy" src="' + g.src + '" alt="' + esc(g.cap[L]) + '"><span>' + esc(g.cap[L]) + "</span></button>";
  }).join("");
  if (lbOpen !== null) showLb(lbOpen);

  // price list
  document.getElementById("rows").innerHTML = TOURS.map(function(t){
    var ask = t.usd == null;
    return "<tr><td>" + esc(t.name[L]) + "</td><td>" + esc(t.dur ? t.dur[L] : u.dur_ask) + '</td><td class="num' + (ask ? " ask" : "") + '">' +
      esc(ask ? u.ask_cell : priceLabel(t, L)) + "</td></tr>";
  }).join("");
  document.getElementById("note").textContent = u.note.replace("{r}", String(CONFIG.rates[L] || "").replace(/\B(?=(\d{3})+(?!\d))/g, " "));

  // header, hero, promo and footer contact buttons
  document.querySelectorAll("[data-contact]").forEach(function(a){
    a.href = contact(a.getAttribute("data-contact"), msgFor(a.getAttribute("data-msg"), L), L);
  });
}

function showLb(i){
  var n = GALLERY.length; lbOpen = (i + n) % n;
  var g = GALLERY[lbOpen];
  document.getElementById("lb-img").src = g.src;
  document.getElementById("lb-img").alt = g.cap[state.lang];
  document.getElementById("lb-cap").textContent = g.cap[state.lang];
  document.getElementById("lb").classList.add("open");
}
function closeLb(){ lbOpen = null; document.getElementById("lb").classList.remove("open"); }
document.addEventListener("keydown", function(e){
  if (lbOpen === null) return;
  if (e.key === "Escape") closeLb();
  if (e.key === "ArrowLeft") showLb(lbOpen - 1);
  if (e.key === "ArrowRight") showLb(lbOpen + 1);
});
document.addEventListener("click", function(e){
  var sh = e.target.closest(".shot");
  if (sh) { showLb(parseInt(sh.getAttribute("data-i"), 10)); return; }
  if (e.target.id === "lb-prev") { showLb(lbOpen - 1); return; }
  if (e.target.id === "lb-next") { showLb(lbOpen + 1); return; }
  if (e.target.id === "lb-close" || e.target.id === "lb") { closeLb(); return; }

  var lb = e.target.closest(".lang button");
  if (lb) { state.lang = lb.getAttribute("data-lang"); try { localStorage.setItem("vth-lang", state.lang); } catch(err) {} render(); return; }
  var ch = e.target.closest(".chip");
  if (ch) { state.cat = ch.getAttribute("data-cat"); render(); }
});

render();

/* ===== background video: two layers, cross-faded near the end for a seamless loop ===== */
(function(){
  var a = document.getElementById("v1"), b = document.getElementById("v2");
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var cur = a, other = b, swapping = false, playing = false;
  a.muted = true; b.muted = true;
  a.addEventListener("error", function(){ a.style.display = "none"; b.style.display = "none"; });

  // Show the first frame as soon as it exists, even if autoplay is blocked or motion is reduced.
  function reveal(){ a.classList.add("on"); }
  if (a.readyState >= 2) reveal(); else a.addEventListener("loadeddata", reveal);

  function play(v){
    var p = v.play();
    if (p && p.then) return p.then(function(){ playing = true; }).catch(function(){ playing = false; });
  }
  function tryStart(){
    if (reduce || playing) return;
    play(a);
  }
  if (a.readyState >= 3) tryStart(); else a.addEventListener("canplay", tryStart);
  // If the browser blocked autoplay (battery saver, in-app browsers), start on the first touch or click.
  ["pointerdown","touchstart","keydown","scroll"].forEach(function(ev){
    window.addEventListener(ev, function once(){ window.removeEventListener(ev, once); tryStart(); }, { passive:true });
  });

  function tick(){
    var v = cur;
    if (!playing || !v.duration || swapping) return;
    if (v.duration < 4) { v.loop = true; return; }
    if (v.duration - v.currentTime < 1.4) {
      swapping = true;
      other.currentTime = 0;
      other.classList.add("on");
      play(other);
      v.classList.remove("on");
      setTimeout(function(){
        v.pause(); v.currentTime = 0;
        var t = cur; cur = other; other = t; swapping = false;
      }, 1500);
    }
  }
  a.addEventListener("timeupdate", tick);
  b.addEventListener("timeupdate", tick);
  document.addEventListener("visibilitychange", function(){
    if (document.hidden) cur.pause(); else if (playing && !reduce) play(cur);
  });
})();
</script>
